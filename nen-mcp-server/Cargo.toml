[package]
name = "nen-mcp-server"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
encoding_rs = "0.8"
chardetng = "0.1"
tree-sitter = "0.22.6"

# 互換性重視のパーサーリスト (ABI v14)
tree-sitter-rust = "0.21.2"
tree-sitter-python = "0.21.0"
tree-sitter-c-sharp = "0.21.0"
tree-sitter-javascript = "0.21.4"
tree-sitter-typescript = "0.21.2"
tree-sitter-java = "0.21.0"
tree-sitter-c = "0.21.3"
tree-sitter-cpp = "0.22.3"
tree-sitter-go = "0.21.0"
tree-sitter-html = "0.20.4"
tree-sitter-css = "0.21.0"
tree-sitter-json = "0.21.0"
tree-sitter-powershell = "0.1"

# 復活第1弾
tree-sitter-toml = "0.5.1"
tree-sitter-yaml = "0.0.1"
tree-sitter-sql = "0.0.2"
tree-sitter-php = "0.22.6"
tree-sitter-ruby = "0.21.0"
tree-sitter-swift = "0.3"
tree-sitter-dockerfile = "0.1"
tree-sitter-kotlin = "0.3"

# まだ喧嘩中のやつ（一旦ステイ）
# tree-sitter-nix = "0.0.1"
# tree-sitter-markdown = "0.1"

chrono = "0.4"
anyhow = "1.0"
windows-sys = { version = "0.52", features = ["Win32_System_Console", "Win32_Foundation"] }
clap = { version = "4.5", features = ["derive"] }
dunce = "1.0"
