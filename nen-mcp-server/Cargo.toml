[package]
name = "nen-mcp-server"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
encoding_rs = "0.8"
chardetng = "0.1"
tree-sitter = "0.20"
tree-sitter-python = "0.20"
tree-sitter-rust = "0.20"
tree-sitter-c-sharp = "0.20"
chrono = "0.4"
anyhow = "1.0"
windows-sys = { version = "0.52", features = ["Win32_System_Console", "Win32_Foundation"] }
